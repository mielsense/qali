name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Types, tests, and builds
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.14
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Check types and production builds
        run: bun run check-types
      - name: Run the repository test suite
        run: bun run test

  packaged-macos:
    name: Packaged macOS lifecycle
    if: github.event_name == 'push'
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.14
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Build the unsigned integration package
        env:
          QALI_GOOGLE_OAUTH_CLIENT_SECRET: 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_123456
        run: bun run desktop:package
      - name: Verify final packaged contents
        run: bun run desktop:verify-app
      - name: Exercise launch, persistence, shutdown, and relaunch
        run: bun run desktop:smoke-packaged
