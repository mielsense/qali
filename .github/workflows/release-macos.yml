name: Release macOS

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release-macos-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Sign and notarize immutable candidate
    runs-on: macos-15
    timeout-minutes: 60
    environment: macos-release-candidate
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out the exact tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.14
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Import the Developer ID certificate
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/qali-developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/qali-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
      - name: Prepare the App Store Connect key
        env:
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
        run: |
          APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY_BASE64" | base64 --decode > "$APPLE_API_KEY_PATH"
          chmod 600 "$APPLE_API_KEY_PATH"
          echo "APPLE_API_KEY_PATH=$APPLE_API_KEY_PATH" >> "$GITHUB_ENV"
      - name: Build, sign, notarize, staple, and verify
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          QALI_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.QALI_GOOGLE_OAUTH_CLIENT_SECRET }}
          QALI_MACOS_SIGNING_IDENTITY: ${{ vars.QALI_MACOS_SIGNING_IDENTITY }}
          QALI_RELEASE_TAG: ${{ github.ref_name }}
        run: bun run desktop:release:mac
      - name: Attest the final release artifacts
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: |
            dist/release/Qali-*.dmg
            dist/release/Qali-*.zip
            dist/release/latest-mac.yml
      - name: Upload the exact candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qali-${{ github.ref_name }}-macos-arm64
          if-no-files-found: error
          retention-days: 30
          path: dist/release/*

  publish:
    name: Publish the verified candidate
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: github-release
    permissions:
      contents: write
    steps:
      - name: Download the exact candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: qali-${{ github.ref_name }}-macos-arm64
          path: dist/release
      - name: Verify artifact digests before publication
        working-directory: dist/release
        run: sha256sum --check SHA256SUMS.txt
      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; reconcile it without overwriting immutable assets."
            exit 1
          fi
      - name: Publish the immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/release/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --title "Qali $GITHUB_REF_NAME"
          --generate-notes
          --latest
